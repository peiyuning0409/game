<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典游戏合集 · Game Hub</title>
<script src="assets/api.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  min-height:100vh; color:#fff;
}
/* ===== 登录/注册 ===== */
#authWrap {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background: linear-gradient(135deg,#0f0c29,#302b63,#24243e); z-index:100;
}
.auth-box {
  width:400px; max-width:92vw; background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:40px 36px;
  backdrop-filter: blur(10px); box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.auth-box h1 { text-align:center; font-size:30px; margin-bottom:6px;
  background:linear-gradient(90deg,#ffd700,#ff8c00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.auth-box .sub { text-align:center; color:#aaa; font-size:13px; margin-bottom:28px; }
.auth-box input {
  width:100%; padding:13px 16px; margin-bottom:14px; border-radius:10px;
  border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.3); color:#fff; font-size:15px; outline:none;
}
.auth-box input:focus { border-color:#ffd700; }
.auth-box .btn {
  width:100%; padding:13px; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer;
  background:linear-gradient(90deg,#ffd700,#ff8c00); color:#1a1a2e; margin-top:6px; transition:.2s;
}
.auth-box .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(255,165,0,.4); }
.auth-box .switch { text-align:center; margin-top:16px; color:#bbb; font-size:14px; }
.auth-box .switch a { color:#ffd700; cursor:pointer; text-decoration:none; }
.auth-box .msg { text-align:center; color:#ff6b6b; font-size:13px; min-height:18px; margin-top:4px; }
.auth-box .tip { text-align:center; color:#888; font-size:12px; margin-top:14px; line-height:1.6; }
/* ===== 主界面 ===== */
#mainWrap { display:none; }
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; background:rgba(0,0,0,.35); border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky; top:0; z-index:50; backdrop-filter:blur(8px);
}
.topbar .logo { font-size:22px; font-weight:bold;
  background:linear-gradient(90deg,#ffd700,#ff8c00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.topbar .user { display:flex; align-items:center; gap:14px; }
.topbar .user .uname { color:#ffd700; font-weight:bold; }
.topbar .btn-sm {
  padding:7px 16px; border-radius:8px; border:1px solid rgba(255,255,255,.25);
  background:transparent; color:#fff; cursor:pointer; font-size:13px; transition:.2s;
}
.topbar .btn-sm:hover { background:rgba(255,255,255,.12); }
.tabs { display:flex; gap:6px; padding:14px 28px 0; }
.tab {
  padding:10px 24px; border-radius:10px 10px 0 0; cursor:pointer; font-size:15px;
  background:rgba(255,255,255,.06); color:#ccc; border:1px solid transparent; border-bottom:none;
}
.tab.active { background:rgba(255,255,255,.12); color:#ffd700; font-weight:bold; }
.content { padding:24px 28px 60px; }
/* 游戏网格 */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:18px; }
.game-card {
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:16px;
  padding:22px 16px; text-align:center; cursor:pointer; transition:.25s; position:relative; overflow:hidden;
}
.game-card:hover { transform:translateY(-6px); border-color:#ffd700; box-shadow:0 12px 30px rgba(0,0,0,.4); }
.game-card .icon { font-size:44px; margin-bottom:10px; }
.game-card .gname { font-size:16px; font-weight:bold; margin-bottom:4px; }
.game-card .gdesc { font-size:12px; color:#aaa; }
.game-card .best { position:absolute; top:10px; left:10px; font-size:11px; color:#ffd700; background:rgba(0,0,0,.4); padding:3px 8px; border-radius:20px; }
.game-card .more-btn {
  position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#fff;
  font-size:17px; line-height:26px; cursor:pointer; z-index:5; transition:.2s; text-align:center;
  font-family:monospace; user-select:none;
}
.game-card .more-btn:hover { background:linear-gradient(90deg,#ffd700,#ff8c00); color:#1a1a2e; border-color:#ffd700; transform:scale(1.1); }
/* 排行榜 */
.rank-table { width:100%; border-collapse:collapse; background:rgba(255,255,255,.05); border-radius:12px; overflow:hidden; }
.rank-table th,.rank-table td { padding:12px 16px; text-align:center; font-size:14px; }
.rank-table th { background:rgba(255,215,0,.15); color:#ffd700; }
.rank-table tr { border-bottom:1px solid rgba(255,255,255,.06); }
.rank-table tr:hover { background:rgba(255,255,255,.05); }
.rank-table .me { color:#ffd700; font-weight:bold; }
.medal { font-size:18px; }
/* 游戏 iframe */
#gameModal {
  position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; display:none;
  flex-direction:column;
}
#gameModal .gm-head { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:#1a1a2e; }
#gameModal .gm-head .t { font-size:18px; font-weight:bold; color:#ffd700; }
#gameModal iframe { flex:1; border:none; width:100%; background:#000; }
/* 游戏详情弹窗 */
#infoModal {
  position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:300; display:none;
  align-items:center; justify-content:center; padding:20px;
}
.info-box {
  background:linear-gradient(135deg,#1a1a2e,#2b2b4a); border:1px solid rgba(255,215,0,.35);
  border-radius:18px; max-width:560px; width:100%; max-height:82vh; overflow:auto; padding:26px 30px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.info-box .info-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.info-box .info-title { font-size:24px; font-weight:bold; color:#ffd700; }
.info-box .info-desc { color:#aaa; font-size:14px; margin-bottom:14px; }
.info-box .info-sec { margin:14px 0 6px; font-size:16px; font-weight:bold; color:#ffd700; }
.info-box .info-text { font-size:14px; line-height:1.9; color:#e8e8e8; white-space:pre-line; }
.info-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
.info-close { padding:8px 20px; border-radius:8px; border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; cursor:pointer; font-size:13px; }
.info-close:hover { background:rgba(255,255,255,.12); }
.info-play { padding:8px 22px; border-radius:8px; border:none; background:linear-gradient(90deg,#ffd700,#ff8c00); color:#1a1a2e; font-weight:bold; cursor:pointer; font-size:13px; }
.info-play:hover { box-shadow:0 6px 16px rgba(255,165,0,.4); }
/* 个人中心 */
.stat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:rgba(255,255,255,.07); border-radius:14px; padding:20px; text-align:center; border:1px solid rgba(255,255,255,.1); }
.stat-card .num { font-size:30px; font-weight:bold; color:#ffd700; }
.stat-card .lbl { font-size:13px; color:#aaa; margin-top:6px; }
.section-title { font-size:18px; font-weight:bold; margin:24px 0 14px; color:#ffd700; }
.empty { text-align:center; color:#888; padding:40px; font-size:14px; }
/* 提示 */
#toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:999;
  background:rgba(0,0,0,.85); color:#fff; padding:12px 26px; border-radius:30px; font-size:14px;
  display:none; border:1px solid rgba(255,255,255,.2);
}
#toast.ok { border-color:#4caf50; } #toast.err { border-color:#ff6b6b; }
.loading { text-align:center; color:#aaa; padding:30px; }
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="authWrap">
  <div class="auth-box">
    <h1>🎮 经典游戏合集</h1>
    <div class="sub">Game Hub · 登录后畅玩全部经典小游戏</div>
    <input id="authUser" placeholder="用户名" autocomplete="off">
    <input id="authPass" type="password" placeholder="密码">
    <div class="msg" id="authMsg"></div>
    <button class="btn" id="authBtn" onclick="doAuth()">登 录</button>
    <div class="switch">还没有账号？<a onclick="toggleAuth()" id="authSwitch">立即注册</a></div>
    <div class="tip">注册即自动登录 · 无需验证码<br>游玩数据与排名将自动保存</div>
  </div>
</div>

<!-- 主界面 -->
<div id="mainWrap">
  <div class="topbar">
    <div class="logo">🎮 经典游戏合集</div>
    <div class="user">
      <span>👤 <span class="uname" id="curUser"></span></span>
      <button class="btn-sm" onclick="showRank()">🏆 排行榜</button>
      <button class="btn-sm" onclick="logout()">退出登录</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tabGames" onclick="switchTab('games')">🎮 游戏大厅</div>
    <div class="tab" id="tabRank" onclick="switchTab('rank')">🏆 排行榜</div>
    <div class="tab" id="tabMe" onclick="switchTab('me')">👤 个人中心</div>
  </div>
  <div class="content">
    <div id="viewGames"></div>
    <div id="viewRank" style="display:none"></div>
    <div id="viewMe" style="display:none"></div>
  </div>
</div>

<!-- 游戏弹窗 -->
<div id="gameModal">
  <div class="gm-head">
    <div class="t" id="gmTitle"></div>
    <button class="btn-sm" onclick="closeGame()">✕ 返回大厅</button>
  </div>
  <iframe id="gameFrame" src="about:blank"></iframe>
</div>

<!-- 游戏详情弹窗 -->
<div id="infoModal">
  <div class="info-box">
    <div class="info-head">
      <div class="info-title" id="infoTitle"></div>
      <button class="info-close" onclick="closeInfo()">✕ 关闭</button>
    </div>
    <div class="info-desc" id="infoDesc"></div>
    <div class="info-sec">🎯 游戏目标</div>
    <div class="info-text" id="infoGoal"></div>
    <div class="info-sec">🕹️ 操作方式</div>
    <div class="info-text" id="infoOper"></div>
    <div class="info-sec">💡 小技巧</div>
    <div class="info-text" id="infoTips"></div>
    <div class="info-actions">
      <button class="info-close" onclick="closeInfo()">返回大厅</button>
      <button class="info-play" id="infoPlayBtn" onclick="playFromInfo()">🎮 开始游戏</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ 全局状态 ============ */
let currentUser = null;
const GAMES = [
  { id:'dino',        name:'小恐龙跑酷',   icon:'🦖', desc:'经典 Chrome 恐龙', score:'分数', how:'目标：跑得越远分数越高。\n操作：按 空格/点击 起跳，按 下方向键 俯冲下压。\n技巧：仙人掌矮要提前小跳，翼龙可以俯冲躲避；连续跳跃时控制好节奏，越到后面速度越快。' },
  { id:'tetris',      name:'俄罗斯方块',   icon:'🧱', desc:'经典下落方块',     score:'分数', how:'目标：消除尽可能多的整行。\n操作：←/→ 左右移动，↑ 旋转方块，↓ 加速下落，空格 直接落底。\n技巧：留出至少一条平整的通道，优先消除最底层的空缺；方块形状要和已有堆叠匹配再旋转。' },
  { id:'snake',       name:'贪吃蛇',       icon:'🐍', desc:'经典贪吃蛇',       score:'分数', how:'目标：吃到食物让蛇变长，得分增加。\n操作：方向键控制蛇头移动。\n技巧：不要贴着墙和自己的身体走，提前规划转弯路线；分数越高蛇越长，越要留足回旋空间。' },
  { id:'minesweeper', name:'扫雷',         icon:'💣', desc:'Windows 经典扫雷', score:'用时(秒)', how:'目标：在最短时间内翻开所有非雷格。\n操作：左键翻开格子，右键标记/取消旗帜。\n技巧：数字代表周围 8 格的雷数，根据数字推断安全格；先点开大片空白区域再逐步推理边缘。' },
  { id:'2048',        name:'2048',         icon:'🔢', desc:'数字合成',         score:'分数', how:'目标：合并相同数字，拼出 2048。\n操作：方向键 / 滑动 让所有方块向同一方向移动。\n技巧：保持大数字固定在某个角落，小数字往大数字方向合并；不要上下左右乱推，避免打乱布局。' },
  { id:'woodfish',    name:'敲木鱼',       icon:'🪵', desc:'解压敲木鱼',       score:'功德', how:'目标：积累功德值，越敲越多。\n操作：点击木鱼即可敲击，每敲一下功德 +1。\n技巧：纯解压游戏，随时可以停下来休息；连点越快功德涨得越快。' },
  { id:'whack',       name:'打地鼠',       icon:'🔨', desc:'经典打地鼠',       score:'分数', how:'目标：在限定时间内打出尽量多的地鼠。\n操作：点击从洞里冒出的地鼠得分。\n技巧：地鼠出现时间短，看到立刻点；注意别点到炸弹，会扣分。' },
  { id:'memory',      name:'记忆翻牌',     icon:'🃏', desc:'翻牌配对',         score:'分数', how:'目标：用最少的翻牌次数把所有图案配对。\n操作：点击翻开两张牌，图案相同则消除。\n技巧：记住每张牌的位置，翻牌时有规律地按顺序翻，先建立地图再配对。' },
  { id:'tictactoe',   name:'井字棋',       icon:'⭕', desc:'三子连线',         score:'胜场', how:'目标：比 AI 先连成三子一线。\n操作：点击 3x3 棋盘空位落子。\n技巧：先手占中心优势最大；注意封堵 AI 的两连威胁，同时自己制造双杀。' },
  { id:'gomoku',      name:'五子棋',       icon:'⚫', desc:'人机对战',         score:'胜场', how:'目标：五子连珠获胜。\n操作：点击棋盘交叉点落子。\n技巧：先占中腹，攻守兼备；留意 AI 活三、冲四，及时堵住；自己也尝试制造双三。' },
  { id:'breakout',    name:'打砖块',       icon:'🏓', desc:'经典弹球打砖块',   score:'分数', how:'目标：用挡板反弹小球击碎所有砖块。\n操作：左右移动鼠标或方向键控制挡板。\n技巧：球从不同角度反弹方向不同，站在球的正下方接球更稳；优先打上层、靠近顶部的砖块。' },
  { id:'plane',       name:'飞机大战',     icon:'✈️', desc:'经典飞机射击',     score:'分数', how:'目标：击落敌机，躲避子弹和碰撞，活得越久分数越高。\n操作：方向键/鼠标 控制飞机移动，自动开火（部分版本按空格发射）。\n技巧：走位躲弹幕，别贪输出；优先清掉密集的敌机群，护住自己。' },
  { id:'guess',       name:'猜数字',       icon:'🔮', desc:'猜 1-100',         score:'猜中次数', how:'目标：用尽量少的次数猜中 1-100 之间的数字。\n操作：输入数字点击提交，系统提示 大了/小了。\n技巧：用二分法，每次都取当前范围中间值，最多 7 次必中。' },
  { id:'sudoku',      name:'数独',         icon:'🧩', desc:'经典数独',         score:'完成数', how:'目标：完成数独盘面，每行、每列、每个 3x3 宫格填入 1-9 且不重复。\n操作：点击空格，选择数字填入。\n技巧：先找"唯一可能"的空格，从只有一个候选数的位置入手；逐行逐宫排查候选数。' },
  { id:'match3',      name:'消消乐',       icon:'🍬', desc:'三消糖果',         score:'分数', how:'目标：交换相邻糖果，让三个或以上同色连成一线消除得分。\n操作：点击选中糖果，再点击相邻糖果交换位置。\n技巧：尽量制造四连、五连触发特殊糖果；从底部消除更容易引发连锁下落。' },
  { id:'rps',         name:'石头剪刀布',   icon:'✊', desc:'人机对决',         score:'胜场', how:'目标：赢过 AI，累计胜场。\n操作：点击 石头✊ / 剪刀✌️ / 布🖐 出招。\n技巧：观察 AI 的出招习惯，适当变化策略；偶尔故意反着出，打乱规律。' },
  { id:'typing',      name:'打字达人',     icon:'⌨️', desc:'英文打字',         score:'分数', how:'目标：在规定时间内打出尽量多的正确单词。\n操作：看到屏幕上的英文单词，用键盘快速输入并回车/自动提交。\n技巧：保持手指位置正确，看单词别盯键盘；先求准再求快。' },
  { id:'catch',       name:'接水果',       icon:'🍎', desc:'接住掉落水果',     score:'分数', how:'目标：接住尽量多的掉落水果。\n操作：左右移动鼠标/方向键控制底部篮子。\n技巧：站在水果落点下方等它，别来回乱跑；注意同时掉落多个水果时优先接价值高的。' },
  { id:'maze',        name:'迷宫',         icon:'🌀', desc:'走出迷宫',         score:'通关数', how:'目标：从起点走到终点，通关迷宫。\n操作：方向键/点击 控制角色移动。\n技巧：沿着一侧墙壁（比如一直靠右）走，保证能找到出口；记住走过的死胡同。' },
  { id:'flappy',      name:'像素鸟',       icon:'🐤', desc:'经典 Flappy Bird', score:'分数', how:'目标：控制小鸟穿过管道缝隙，穿过的管道越多分越高。\n操作：点击/空格 让小鸟扇翅上升，松手自然下落。\n技巧：轻点保持节奏，不要狂点；让小鸟保持在管道间隙的中间高度平稳飞行。' }
];

/* ============ 登录 / 注册 ============ */
let isRegister = false;
function toggleAuth() {
  isRegister = !isRegister;
  document.getElementById('authBtn').textContent = isRegister ? '注 册' : '登 录';
  document.getElementById('authSwitch').textContent = isRegister ? '已有账号，去登录' : '立即注册';
  document.getElementById('authMsg').textContent = '';
}
async function doAuth() {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  if (!u || !p) { msg.textContent = '请输入用户名和密码'; return; }
  if (u.length < 2 || u.length > 20) { msg.textContent = '用户名需 2-20 个字符'; return; }
  if (p.length < 4) { msg.textContent = '密码至少 4 位'; return; }
  msg.textContent = '处理中...';
  try {
    const data = await GH.readFile('data/users.json');
    const users = data ? data.content.users : [];
    const exist = users.find(x => x.username === u);
    if (isRegister) {
      if (exist) { msg.textContent = '该用户名已被注册'; return; }
      const nu = { username: u, password: p, regTime: new Date().toLocaleString('zh-CN'), plays: 0 };
      users.push(nu);
      await GH.writeFile('data/users.json', { users }, data ? data.sha : undefined);
      currentUser = nu;
      toast('注册成功，欢迎加入！', 'ok');
    } else {
      if (!exist) { msg.textContent = '用户不存在，请先注册'; return; }
      if (exist.password !== p) { msg.textContent = '密码错误'; return; }
      currentUser = exist;
      toast('登录成功！', 'ok');
    }
    localStorage.setItem('gh_user', u);
    enterMain();
  } catch (e) {
    msg.textContent = '网络错误，请重试';
    console.error(e);
  }
}
function logout() {
  localStorage.removeItem('gh_user');
  location.reload();
}

/* ============ 进入主界面 ============ */
function enterMain() {
  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  document.getElementById('curUser').textContent = currentUser.username;
  renderGames();
  loadMyStats();
}

/* ============ 游戏大厅 ============ */
async function renderGames() {
  const el = document.getElementById('viewGames');
  el.innerHTML = '<div class="loading">加载中...</div>';
  let bests = {};
  try {
    const data = await GH.readFile('data/scores.json');
    if (data) {
      data.content.scores.forEach(s => {
        if (s.username === currentUser.username) {
          if (!bests[s.game] || s.score > bests[s.game]) bests[s.game] = s.score;
        }
      });
    }
  } catch(e) {}
  let html = '<div class="grid">';
  GAMES.forEach(g => {
    const best = bests[g.id] !== undefined ? bests[g.id] : null;
    html += `<div class="game-card" onclick="openGame('${g.id}','${g.name}')">
      <div class="more-btn" title="查看详情与玩法" onclick="event.stopPropagation();showGameInfo('${g.id}')">⋯</div>
      <div class="icon">${g.icon}</div>
      <div class="gname">${g.name}</div>
      <div class="gdesc">${g.desc}</div>
      ${best !== null ? `<div class="best">🏅 ${best}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function openGame(id, name) {
  document.getElementById('gmTitle').textContent = name;
  document.getElementById('gameFrame').src = 'games/' + id + '.html';
  document.getElementById('gameModal').style.display = 'flex';
}

/* ============ 游戏详情（⋯ 按钮） ============ */
let infoGameId = null;
function showGameInfo(id) {
  const g = GAMES.find(x => x.id === id);
  if (!g) return;
  infoGameId = id;
  document.getElementById('infoTitle').textContent = g.icon + ' ' + g.name;
  document.getElementById('infoDesc').textContent = g.desc;
  const lines = (g.how || '').split('\n');
  let goal = '', oper = '', tips = '';
  lines.forEach(l => {
    if (l.indexOf('目标：') === 0) goal = l.slice(3);
    else if (l.indexOf('操作：') === 0) oper = l.slice(3);
    else if (l.indexOf('技巧：') === 0) tips = l.slice(3);
  });
  document.getElementById('infoGoal').textContent = goal || '—';
  document.getElementById('infoOper').textContent = oper || '—';
  document.getElementById('infoTips').textContent = tips || '—';
  document.getElementById('infoModal').style.display = 'flex';
}
function closeInfo() {
  document.getElementById('infoModal').style.display = 'none';
  infoGameId = null;
}
function playFromInfo() {
  if (!infoGameId) return;
  const g = GAMES.find(x => x.id === infoGameId);
  closeInfo();
  openGame(g.id, g.name);
}
function closeGame() {
  document.getElementById('gameModal').style.display = 'none';
  document.getElementById('gameFrame').src = 'about:blank';
  renderGames();
  loadMyStats();
}

/* ============ 成绩保存（串行队列 + 失败静默暂存重放） ============ */
/* 核心思路：
 * 1) 所有写入经 GH.updateFile 串行队列执行，多局连续游玩不再并发冲突；
 * 2) 写入失败不再弹「成绩保存失败」打扰用户，记录暂存本地，稍后自动重放；
 * 3) 排行榜关键数据(scores)保证优先写入，辅助统计(stats/users)失败静默忽略。 */
const pendingScores = [];
let saving = false;

async function flushScores() {
  if (!currentUser || saving || pendingScores.length === 0) return;
  saving = true;
  const batch = pendingScores.splice(0, pendingScores.length);
  try {
    await GH.updateFile('data/scores.json', (d) => {
      batch.forEach(s => d.scores.push(s));
      return d;
    });
    try {
      await GH.updateFile('data/stats.json', (d) => {
        batch.forEach(s => d.stats.push({ username: currentUser.username, game: s.game, time: s.time }));
        return d;
      });
      await GH.updateFile('data/users.json', (d) => {
        const u = d.users.find(x => x.username === currentUser.username);
        if (u) u.plays = (u.plays || 0) + batch.length;
        return d;
      });
    } catch (e) { console.warn('辅助统计写入失败(已忽略)', e); }
    toast('成绩已保存！', 'ok');
  } catch (e) {
    pendingScores.unshift(...batch);
    console.warn('成绩暂存，稍后自动重试', e);
  } finally {
    saving = false;
    if (pendingScores.length) setTimeout(flushScores, 3000);
  }
}

/* 接收游戏分数 */
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'game-score') return;
  const { game, score } = e.data;
  if (!currentUser) return;
  pendingScores.push({ username: currentUser.username, game, score, time: new Date().toLocaleString('zh-CN') });
  flushScores();
});

/* ============ 排行榜 ============ */
async function showRank() {
  switchTab('rank');
  const el = document.getElementById('viewRank');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const data = await GH.readFile('data/scores.json');
    const scores = data ? data.content.scores : [];
    let html = '<div class="section-title">🏆 各游戏排行榜</div>';
    GAMES.forEach(g => {
      const list = scores.filter(s => s.game === g.id);
      const best = {};
      list.forEach(s => {
        if (!best[s.username] || s.score > best[s.username]) best[s.username] = s.score;
      });
      const sorted = Object.entries(best).sort((a,b) => b[1]-a[1]).slice(0,10);
      html += `<div style="margin-bottom:26px">
        <div style="font-size:16px;font-weight:bold;margin-bottom:10px">${g.icon} ${g.name}</div>`;
      if (sorted.length === 0) {
        html += '<div class="empty">暂无记录，快来抢占第一名！</div>';
      } else {
        html += '<table class="rank-table"><tr><th>排名</th><th>玩家</th><th>最高分</th></tr>';
        sorted.forEach(([u, s], i) => {
          const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
          const me = u === currentUser.username ? ' class="me"' : '';
          html += `<tr${me}><td><span class="medal">${medal}</span></td><td>${u}${u===currentUser.username?' (我)':''}</td><td>${s}</td></tr>`;
        });
        html += '</table>';
      }
      html += '</div>';
    });
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  }
}

/* ============ 个人中心 ============ */
async function loadMyStats() {
  const el = document.getElementById('viewMe');
  el.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const [sData, uData] = await Promise.all([
      GH.readFile('data/scores.json'),
      GH.readFile('data/users.json')
    ]);
    const scores = sData ? sData.content.scores : [];
    const users = uData ? uData.content.users : [];
    const me = users.find(x => x.username === currentUser.username) || currentUser;
    const myScores = scores.filter(s => s.username === currentUser.username);
    const gamesPlayed = new Set(myScores.map(s => s.game)).size;
    const totalPlays = me.plays || myScores.length;
    const bestScore = myScores.length ? Math.max(...myScores.map(s => s.score)) : 0;

    let html = `<div class="stat-cards">
      <div class="stat-card"><div class="num">${totalPlays}</div><div class="lbl">总游玩次数</div></div>
      <div class="stat-card"><div class="num">${gamesPlayed}</div><div class="lbl">玩过的游戏</div></div>
      <div class="stat-card"><div class="num">${bestScore}</div><div class="lbl">历史最高分</div></div>
      <div class="stat-card"><div class="num">${me.regTime || '-'}</div><div class="lbl">注册时间</div></div>
    </div>`;
    html += '<div class="section-title">📜 我的游玩记录</div>';
    if (myScores.length === 0) {
      html += '<div class="empty">还没有游玩记录，去游戏大厅玩一局吧！</div>';
    } else {
      const recent = myScores.slice(-20).reverse();
      html += '<table class="rank-table"><tr><th>游戏</th><th>成绩</th><th>时间</th></tr>';
      recent.forEach(s => {
        const g = GAMES.find(x => x.id === s.game);
        html += `<tr><td>${g ? g.icon + ' ' + g.name : s.game}</td><td>${s.score}</td><td>${s.time}</td></tr>`;
      });
      html += '</table>';
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
  }
}

/* ============ Tab 切换 ============ */
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.getElementById('tabGames').classList.toggle('active', t==='games');
  document.getElementById('tabRank').classList.toggle('active', t==='rank');
  document.getElementById('tabMe').classList.toggle('active', t==='me');
  document.getElementById('viewGames').style.display = t==='games' ? 'block' : 'none';
  document.getElementById('viewRank').style.display = t==='rank' ? 'block' : 'none';
  document.getElementById('viewMe').style.display = t==='me' ? 'block' : 'none';
  if (t==='rank') showRank();
  if (t==='me') loadMyStats();
}

/* ============ Toast ============ */
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type || '';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 2500);
}

/* ============ 初始化 ============ */
(async function init() {
  const saved = localStorage.getItem('gh_user');
  if (saved) {
    try {
      const data = await GH.readFile('data/users.json');
      const users = data ? data.content.users : [];
      const u = users.find(x => x.username === saved);
      if (u) {
        currentUser = u;
        enterMain();
        return;
      }
    } catch(e) {}
  }
  document.getElementById('authWrap').style.display = 'flex';
})();
</script>
