<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块</title>
<style>
body{margin:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff;overflow:hidden}
h2{margin:0 0 10px;color:#ffd700}
#info{font-size:13px;color:#aaa;margin-bottom:8px}
canvas{background:#222;border:2px solid #444;border-radius:8px;cursor:none}
#over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;flex-direction:column;z-index:10}
#over .score{font-size:40px;color:#ffd700;font-weight:bold}
#over button{margin-top:16px;padding:12px 30px;font-size:16px;border:none;border-radius:8px;background:#ffd700;color:#1a1a2e;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<h2>🏓 打砖块</h2>
<div id="info">移动鼠标控制挡板 · 弹球击碎所有砖块</div>
<canvas id="c" width="600" height="400"></canvas>
<div id="over"><div class="score" id="finalScore">0</div><button onclick="restart()">再来一局</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let paddle,ball,bricks,score,over,raf;
const BRICK_ROWS=5,BRICK_COLS=8;
function restart(){
  paddle={x:250,w:100,h:14};
  ball={x:300,y:300,vx:3,vy:-4,r:8};
  bricks=[];
  for(let r=0;r<BRICK_ROWS;r++)for(let c=0;c<BRICK_COLS;c++){
    bricks.push({x:c*75+5,y:r*30+30,w:70,h:24,alive:true,color:`hsl(${r*40+20},70%,55%)`});
  }
  score=0;over=false;
  document.getElementById('over').style.display='none';
  cancelAnimationFrame(raf);
  loop();
}
cv.onmousemove=e=>{
  const rect=cv.getBoundingClientRect();
  paddle.x=e.clientX-rect.left-paddle.w/2;
  paddle.x=Math.max(0,Math.min(600-paddle.w,paddle.x));
};
function loop(){
  ctx.clearRect(0,0,600,400);
  // paddle
  ctx.fillStyle='#ffd700';ctx.fillRect(paddle.x,380,paddle.w,paddle.h);
  // ball
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<ball.r||ball.x>600-ball.r)ball.vx*=-1;
  if(ball.y<ball.r)ball.vy*=-1;
  if(ball.y>400){gameOver();return;}
  // paddle bounce
  if(ball.y+ball.r>380&&ball.y-ball.r<380+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){
    ball.vy*=-1;
    ball.vx=(ball.x-(paddle.x+paddle.w/2))/20;
  }
  // bricks
  bricks.forEach(b=>{
    if(b.alive&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){
      b.alive=false;ball.vy*=-1;score+=10;
    }
  });
  bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);}});
  ctx.fillStyle='#ffd700';ctx.font='bold 18px sans-serif';ctx.fillText('分数: '+score,10,25);
  if(bricks.every(b=>!b.alive)){gameOver();return;}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  raf=requestAnimationFrame(loop);
}
function gameOver(){
  over=true;cancelAnimationFrame(raf);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('over').style.display='flex';
  parent.postMessage({type:'game-score',game:'breakout',score:score},'*');
}
restart();
</script>
</body>
</html>
