<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数独</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;padding:12px}
h2{margin:0 0 6px;font-size:22px;background:linear-gradient(90deg,#ffd700,#ff8c42);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
#info{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px;text-align:center}
#status{font-size:15px;color:#ffd700;margin-bottom:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:rgba(255,255,255,.08);padding:6px;border-radius:14px;width:min(92vw,420px);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.cell{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:min(5vw,22px);font-weight:700;cursor:pointer;user-select:none;transition:background .15s,box-shadow .15s}
.cell.given{color:#ffd700}
.cell.sel{background:rgba(255,215,0,.25);box-shadow:inset 0 0 0 2px #ffd700}
.cell.wrong{color:#e74c3c;animation:shake .2s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#pad{display:grid;grid-template-columns:repeat(5,min(16vw,56px));gap:6px;margin-top:12px}
#pad button{border:none;border-radius:10px;background:rgba(255,255,255,.1);color:#ffd700;font-size:18px;font-weight:700;padding:10px 0;cursor:pointer;transition:background .15s,transform .1s}
#pad button:active{background:rgba(255,215,0,.3);transform:scale(.9)}
#over{display:none;position:fixed;inset:0;background:rgba(10,8,30,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;z-index:20;animation:fadeIn .3s}
#over .score{font-size:44px;color:#ffd700;font-weight:800;text-shadow:0 0 20px rgba(255,215,0,.5)}
#over .sub{color:rgba(255,255,255,.6);margin-top:6px;font-size:14px}
button{margin-top:18px;padding:12px 34px;font-size:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a1a2e;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(255,140,66,.35);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(255,140,66,.5)}
button:active{transform:scale(.96)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<h2>数独</h2>
<div id="info">点击格子 · 数字键盘填入 · 每行每列每宫 1-9 不重复</div>
<div id="status">点击格子开始</div>
<div id="board"></div>
<div id="pad">
  <button onclick="input(1)">1</button><button onclick="input(2)">2</button><button onclick="input(3)">3</button><button onclick="input(4)">4</button><button onclick="input(5)">5</button>
  <button onclick="input(6)">6</button><button onclick="input(7)">7</button><button onclick="input(8)">8</button><button onclick="input(9)">9</button><button onclick="input(0)">清除</button>
</div>
<div id="over"><div class="score" id="finalScore">0</div><div class="sub">本局结果</div><button onclick="restart()">再来一局</button></div>
<script>
let puzzle,solution,sel,over;
let actx=null;
function sfx(freq,dur,type,vol,slide){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sPlace=()=>sfx(400,.05,'triangle',.08,100);
const sWrong=()=>sfx(180,.12,'square',.08,-40);
const sWin=()=>{sfx(523,.12,'triangle',.12);setTimeout(()=>sfx(659,.12,'triangle',.12),120);setTimeout(()=>sfx(784,.2,'triangle',.12),240);};
function generate(){
  const s=Array.from({length:9},()=>Array(9).fill(0));
  function fill(){
    for(let r=0;r<9;r++)for(let c=0;c<9;c++){
      if(s[r][c]===0){
        const nums=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-0.5);
        for(let n of nums){
          if(valid(r,c,n)){
            s[r][c]=n;
            if(fill())return true;
            s[r][c]=0;
          }
        }
        return false;
      }
    }
    return true;
  }
  fill();
  return s;
}
function valid(r,c,n){
  for(let i=0;i<9;i++){if(s[r][i]===n||s[i][c]===n)return false;}
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(s[br+i][bc+j]===n)return false;
  return true;
}
function restart(){
  solution=generate();
  puzzle=solution.map(row=>row.slice());
  const cells=Array.from({length:81},(_,i)=>i).sort(()=>Math.random()-0.5);
  for(let i=0;i<54;i++){
    const idx=cells[i];
    puzzle[Math.floor(idx/9)][idx%9]=0;
  }
  sel=null;over=false;
  document.getElementById('over').style.display='none';
  document.getElementById('status').textContent='点击格子开始';
  render();
}
function render(){
  const b=document.getElementById('board');b.innerHTML='';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const d=document.createElement('div');
    d.className='cell';
    if(puzzle[r][c]!==0){d.textContent=puzzle[r][c];d.classList.add('given');}
    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add('sel');
    d.onclick=()=>{sel=[r,c];render();};
    b.appendChild(d);
  }
}
function input(n){
  if(over||!sel)return;
  const [r,c]=sel;
  if(solution[r][c]===0)return;
  if(n===0){puzzle[r][c]=0;render();return;}
  if(n===solution[r][c]){puzzle[r][c]=n;sPlace();render();checkWin();}
  else{
    sWrong();
    const b=document.getElementById('board');
    const idx=r*9+c;
    const cell=b.children[idx];
    cell.classList.add('wrong');
    setTimeout(()=>cell.classList.remove('wrong'),300);
  }
}
function checkWin(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(puzzle[r][c]!==solution[r][c])return;
  over=true;sWin();
  document.getElementById('finalScore').textContent='完成!';
  document.getElementById('over').style.display='flex';
  parent.postMessage({type:'game-score',game:'sudoku',score:100},'*');
}
restart();
</script>
</body>
</html>
