<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素鸟</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;padding:12px}
h2{margin:0 0 6px;font-size:22px;background:linear-gradient(90deg,#ffd700,#ff8c42);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
#info{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px;text-align:center}
#hud{display:flex;gap:24px;margin-bottom:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#hud .lbl{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:1px}
#hud .val{font-size:20px;color:#ffd700;font-weight:700;text-shadow:0 0 12px rgba(255,215,0,.4)}
#c{background:linear-gradient(180deg,#4d96ff,#7ec8ff);border:1px solid rgba(255,255,255,.15);border-radius:12px;display:block;box-shadow:0 12px 40px rgba(0,0,0,.45);touch-action:none}
#over{display:none;position:fixed;inset:0;background:rgba(10,8,30,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;z-index:20;animation:fadeIn .3s}
#over .score{font-size:44px;color:#ffd700;font-weight:800;text-shadow:0 0 20px rgba(255,215,0,.5)}
#over .sub{color:rgba(255,255,255,.6);margin-top:6px;font-size:14px}
button{margin-top:18px;padding:12px 34px;font-size:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a1a2e;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(255,140,66,.35);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(255,140,66,.5)}
button:active{transform:scale(.96)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:640px){#c{max-width:min(94vw,400px);height:auto}}
</style>
</head>
<body>
<h2>像素鸟</h2>
<div id="info">点击 / 空格 / 触摸 让小鸟飞 · 穿过管道</div>
<div id="hud">
  <div><div class="lbl">分数</div><div class="val" id="scoreBox">0</div></div>
</div>
<canvas id="c" width="400" height="600"></canvas>
<div id="over"><div class="score" id="finalScore">0</div><div class="sub">本局得分</div><button onclick="restart()">再来一局</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let bird,pipes,score,over,raf,frame=0;
let actx=null;
function sfx(freq,dur,type,vol,slide){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sFlap=()=>sfx(400,.06,'triangle',.1,150);
const sScore=()=>{sfx(660,.08,'triangle',.1);setTimeout(()=>sfx(880,.1,'triangle',.08),50);};
const sOver=()=>{sfx(400,.2,'sawtooth',.12,-200);setTimeout(()=>sfx(200,.3,'sawtooth',.12,-120),150);};
function restart(){
  bird={x:100,y:300,vy:0};
  pipes=[];score=0;over=false;frame=0;
  document.getElementById('over').style.display='none';
  document.getElementById('scoreBox').textContent=0;
  cancelAnimationFrame(raf);
  loop();
}
function flap(){
  if(over)return;
  bird.vy=-7;sFlap();
}
cv.onclick=flap;
cv.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
function loop(){
  ctx.clearRect(0,0,400,600);
  frame++;
  bird.vy+=0.5;
  bird.y+=bird.vy;
  if(frame%80===0){
    const gap=150;
    const topH=50+Math.random()*250;
    pipes.push({x:400,top:topH,bottom:topH+gap,passed:false});
  }
  pipes.forEach(p=>p.x-=3);
  pipes=pipes.filter(p=>p.x>-60);
  pipes.forEach(p=>{if(!p.passed&&p.x<bird.x){p.passed=true;score++;sScore();document.getElementById('scoreBox').textContent=score;}});
  if(bird.y<0||bird.y>600){sOver();gameOver();return;}
  for(let p of pipes){
    if(bird.x+20>p.x&&bird.x<p.x+60){
      if(bird.y<p.top||bird.y+20>p.bottom){sOver();gameOver();return;}
    }
  }
  ctx.shadowColor='#ffd700';ctx.shadowBlur=14;
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(bird.x,bird.y,15,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(bird.x+10,bird.y-4,5,0,Math.PI*2);ctx.fill();
  pipes.forEach(p=>{
    ctx.fillStyle='#4caf50';ctx.fillRect(p.x,0,60,p.top);
    ctx.fillRect(p.x,p.bottom,60,600-p.bottom);
    ctx.fillStyle='#2e7d32';ctx.fillRect(p.x-3,p.top-20,66,20);
    ctx.fillRect(p.x-3,p.bottom,66,20);
  });
  raf=requestAnimationFrame(loop);
}
function gameOver(){
  over=true;cancelAnimationFrame(raf);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('over').style.display='flex';
  parent.postMessage({type:'game-score',game:'flappy',score:score},'*');
}
restart();
</script>
</body>
</html>
