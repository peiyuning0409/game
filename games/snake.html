<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
body{margin:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff;overflow:hidden}
h2{margin:0 0 10px;color:#ffd700}
#info{font-size:13px;color:#aaa;margin-bottom:8px}
canvas{background:#222;border:2px solid #444;border-radius:8px}
#over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;flex-direction:column;z-index:10}
#over .score{font-size:40px;color:#ffd700;font-weight:bold}
#over button{margin-top:16px;padding:12px 30px;font-size:16px;border:none;border-radius:8px;background:#ffd700;color:#1a1a2e;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<h2>🐍 贪吃蛇</h2>
<div id="info">方向键 / WASD 控制 · 吃到食物变长</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="over"><div class="score" id="finalScore">0</div><button onclick="restart()">再来一局</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SIZE=20,N=20;
let snake,dir,nextDir,food,score,over,timer;
function restart(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;over=false;
  placeFood();
  document.getElementById('over').style.display='none';
  clearInterval(timer);
  timer=setInterval(step,120);
}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score+=10;placeFood();}
  else snake.pop();
  draw();
}
function draw(){
  ctx.clearRect(0,0,400,400);
  ctx.fillStyle='#4caf50';ctx.fillRect(food.x*SIZE,food.y*SIZE,SIZE-1,SIZE-1);
  snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#ffd700':'#4d96ff';ctx.fillRect(s.x*SIZE,s.y*SIZE,SIZE-1,SIZE-1);});
  ctx.fillStyle='#ffd700';ctx.font='bold 16px sans-serif';ctx.fillText('分数: '+score,10,20);
}
function gameOver(){over=true;clearInterval(timer);document.getElementById('finalScore').textContent=score;document.getElementById('over').style.display='flex';parent.postMessage({type:'game-score',game:'snake',score:score},'*');}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'){if(dir.y!==1)nextDir={x:0,y:-1};}
  else if(k==='arrowdown'||k==='s'){if(dir.y!==-1)nextDir={x:0,y:1};}
  else if(k==='arrowleft'||k==='a'){if(dir.x!==1)nextDir={x:-1,y:0};}
  else if(k==='arrowright'||k==='d'){if(dir.x!==-1)nextDir={x:1,y:0};}
});
restart();
</script>
</body>
</html>
