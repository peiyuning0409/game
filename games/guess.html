<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猜数字</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;padding:12px}
h2{margin:0 0 6px;font-size:22px;background:linear-gradient(90deg,#ffd700,#ff8c42);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
#info{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px;text-align:center}
#hint{font-size:20px;color:#ffd700;margin:10px 0;min-height:28px;text-shadow:0 0 12px rgba(255,215,0,.3)}
#input{width:min(70vw,220px);padding:12px;font-size:18px;text-align:center;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;outline:none;transition:border .2s}
#input:focus{border-color:#ffd700}
#btn{margin-top:12px;padding:10px 30px;font-size:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a1a2e;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(255,140,66,.35);transition:transform .15s,box-shadow .15s}
#btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(255,140,66,.5)}
#btn:active{transform:scale(.96)}
#history{width:min(90vw,320px);max-height:200px;overflow-y:auto;margin-top:16px;text-align:center;color:rgba(255,255,255,.6);font-size:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px}
#over{display:none;position:fixed;inset:0;background:rgba(10,8,30,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;z-index:20;animation:fadeIn .3s}
#over .score{font-size:44px;color:#ffd700;font-weight:800;text-shadow:0 0 20px rgba(255,215,0,.5)}
#over .sub{color:rgba(255,255,255,.6);margin-top:6px;font-size:14px}
#over button{margin-top:18px;padding:12px 34px;font-size:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a1a2e;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(255,140,66,.35);transition:transform .15s,box-shadow .15s}
#over button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(255,140,66,.5)}
#over button:active{transform:scale(.96)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<h2>猜数字</h2>
<div id="info">猜 1-100 之间的数字 · 看谁猜得快</div>
<div id="hint">请输入你的猜测</div>
<input id="input" type="number" min="1" max="100" onkeydown="if(event.key==='Enter')guess()">
<div><button id="btn" onclick="guess()">猜!</button></div>
<div id="history"></div>
<div id="over"><div class="score" id="finalScore">0</div><div class="sub">本局结果</div><button onclick="restart()">再来一局</button></div>
<script>
let target,count;
let actx=null;
function sfx(freq,dur,type,vol,slide){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sWrong=()=>sfx(220,.1,'square',.08,-60);
const sWin=()=>{sfx(523,.12,'triangle',.12);setTimeout(()=>sfx(659,.12,'triangle',.12),120);setTimeout(()=>sfx(784,.2,'triangle',.12),240);};
function restart(){
  target=Math.floor(Math.random()*100)+1;
  count=0;
  document.getElementById('hint').textContent='请输入你的猜测';
  document.getElementById('history').textContent='';
  document.getElementById('input').value='';
  document.getElementById('over').style.display='none';
}
function guess(){
  const v=parseInt(document.getElementById('input').value);
  if(!v||v<1||v>100){document.getElementById('hint').textContent='请输入 1-100 的数字';return;}
  count++;
  const h=document.getElementById('history');
  if(v===target){
    document.getElementById('hint').textContent='🎉 猜对了! 用了 '+count+' 次';
    h.textContent+='第'+count+'次: '+v+' ✓\n';
    document.getElementById('finalScore').textContent='猜中! 用了 '+count+' 次';
    document.getElementById('over').style.display='flex';
    sWin();
    parent.postMessage({type:'game-score',game:'guess',score:count},'*');
  }else if(v<target){
    document.getElementById('hint').textContent='太小了，再大一点';
    h.textContent+='第'+count+'次: '+v+' 太小\n';
    sWrong();
  }else{
    document.getElementById('hint').textContent='太大了，再小一点';
    h.textContent+='第'+count+'次: '+v+' 太大\n';
    sWrong();
  }
  document.getElementById('input').value='';
  document.getElementById('input').focus();
}
restart();
</script>
</body>
</html>
