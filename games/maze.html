<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷宫</title>
<style>
body{margin:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff;overflow:hidden}
h2{margin:0 0 10px;color:#ffd700}
#info{font-size:13px;color:#aaa;margin-bottom:8px}
#status{font-size:16px;color:#ffd700;margin-bottom:10px}
canvas{background:#222;border:2px solid #444;border-radius:8px}
#over{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;flex-direction:column;z-index:10}
#over .score{font-size:40px;color:#ffd700;font-weight:bold}
#over button{margin-top:16px;padding:12px 30px;font-size:16px;border:none;border-radius:8px;background:#ffd700;color:#1a1a2e;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<h2>🌀 迷宫</h2>
<div id="info">方向键/WASD 移动 · 走到绿色出口通关</div>
<div id="status">第 1 关</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="over"><div class="score" id="finalScore">0</div><button onclick="restart()">再来一局</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SIZE=20,N=20;
let maze,player,level,over;
function generateMaze(){
  const m=Array.from({length:N},()=>Array(N).fill(1));
  const stack=[[1,1]];m[1][1]=0;
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    let moved=false;
    for(let [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<N-1&&ny>0&&ny<N-1&&m[ny][nx]===1){
        m[ny][nx]=0;m[y+dy/2][x+dx/2]=0;
        stack.push([nx,ny]);moved=true;break;
      }
    }
    if(!moved)stack.pop();
  }
  return m;
}
function restart(){
  level=1;over=false;
  loadLevel();
  document.getElementById('over').style.display='none';
}
function loadLevel(){
  maze=generateMaze();
  player={x:1,y:1};
  document.getElementById('status').textContent='第 '+level+' 关';
  draw();
}
function draw(){
  ctx.clearRect(0,0,400,400);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(maze[r][c]){ctx.fillStyle='#4a4a6a';ctx.fillRect(c*SIZE,r*SIZE,SIZE,SIZE);}
  }
  // exit
  ctx.fillStyle='#4caf50';ctx.fillRect((N-2)*SIZE,(N-2)*SIZE,SIZE,SIZE);
  // player
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(player.x*SIZE+SIZE/2,player.y*SIZE+SIZE/2,8,0,Math.PI*2);ctx.fill();
}
document.addEventListener('keydown',e=>{
  if(over)return;
  const k=e.key.toLowerCase();
  let dx=0,dy=0;
  if(k==='arrowup'||k==='w')dy=-1;
  else if(k==='arrowdown'||k==='s')dy=1;
  else if(k==='arrowleft'||k==='a')dx=-1;
  else if(k==='arrowright'||k==='d')dx=1;
  const nx=player.x+dx,ny=player.y+dy;
  if(nx>=0&&nx<N&&ny>=0&&ny<N&&maze[ny][nx]===0){
    player.x=nx;player.y=ny;
    if(nx===N-2&&ny===N-2){
      level++;
      if(level>5){gameOver();return;}
      loadLevel();
      return;
    }
    draw();
  }
});
function gameOver(){
  over=true;
  document.getElementById('finalScore').textContent='通关! 完成 '+level+' 关';
  document.getElementById('over').style.display='flex';
  parent.postMessage({type:'game-score',game:'maze',score:level},'*');
}
restart();
</script>
</body>
</html>
