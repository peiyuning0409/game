<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接水果</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;padding:12px}
h2{margin:0 0 6px;font-size:22px;background:linear-gradient(90deg,#ffd700,#ff8c42);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
#info{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px;text-align:center}
#hud{display:flex;gap:24px;margin-bottom:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#hud .lbl{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:1px}
#hud .val{font-size:20px;color:#ffd700;font-weight:700;text-shadow:0 0 12px rgba(255,215,0,.4)}
#c{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);border-radius:12px;display:block;box-shadow:0 12px 40px rgba(0,0,0,.45);touch-action:none}
#over{display:none;position:fixed;inset:0;background:rgba(10,8,30,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;z-index:20;animation:fadeIn .3s}
#over .score{font-size:44px;color:#ffd700;font-weight:800;text-shadow:0 0 20px rgba(255,215,0,.5)}
#over .sub{color:rgba(255,255,255,.6);margin-top:6px;font-size:14px}
button{margin-top:18px;padding:12px 34px;font-size:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a1a2e;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(255,140,66,.35);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(255,140,66,.5)}
button:active{transform:scale(.96)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:640px){#c{max-width:min(94vw,500px);height:auto}}
</style>
</head>
<body>
<h2>接水果</h2>
<div id="info">鼠标 / 手指拖动篮子接住水果 · 漏掉 3 个结束</div>
<div id="hud">
  <div><div class="lbl">分数</div><div class="val" id="scoreBox">0</div></div>
  <div><div class="lbl">漏掉</div><div class="val" id="missBox">0/3</div></div>
</div>
<canvas id="c" width="500" height="500"></canvas>
<div id="over"><div class="score" id="finalScore">0</div><div class="sub">本局得分</div><button onclick="restart()">再来一局</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FRUITS=['🍎','🍌','🍇','🍓','🍊','🍉','🍑','🥝'];
let basket,fruits,score,miss,over,raf,frame=0;
let actx=null;
function sfx(freq,dur,type,vol,slide){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sCatch=()=>{sfx(520,.08,'triangle',.1);setTimeout(()=>sfx(700,.08,'triangle',.08),40);};
const sMiss=()=>sfx(200,.15,'sawtooth',.1,-80);
const sOver=()=>{sfx(400,.2,'sawtooth',.12,-200);setTimeout(()=>sfx(200,.3,'sawtooth',.12,-120),150);};
function restart(){
  basket={x:200,w:90,h:20};
  fruits=[];score=0;miss=0;over=false;frame=0;
  document.getElementById('over').style.display='none';
  document.getElementById('scoreBox').textContent=0;
  document.getElementById('missBox').textContent='0/3';
  cancelAnimationFrame(raf);
  loop();
}
function setBasket(clientX){
  const rect=cv.getBoundingClientRect();
  const scale=500/rect.width;
  basket.x=(clientX-rect.left)*scale-basket.w/2;
  basket.x=Math.max(0,Math.min(500-basket.w,basket.x));
}
cv.onmousemove=e=>{if(!over)setBasket(e.clientX);};
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!over)setBasket(e.touches[0].clientX);},{passive:false});
function loop(){
  ctx.clearRect(0,0,500,500);
  frame++;
  if(frame%25===0)fruits.push({x:Math.random()*480,y:-20,emoji:FRUITS[Math.floor(Math.random()*FRUITS.length)],speed:2+Math.random()*3});
  fruits.forEach(f=>f.y+=f.speed);
  fruits.forEach(f=>{
    if(f.y+20>basket.y&&f.y<basket.y+basket.h&&f.x>basket.x&&f.x<basket.x+basket.w){f.caught=true;score+=10;sCatch();document.getElementById('scoreBox').textContent=score;}
  });
  fruits=fruits.filter(f=>!f.caught);
  fruits=fruits.filter(f=>{if(f.y>500){miss++;sMiss();document.getElementById('missBox').textContent=miss+'/3';return false;}return true;});
  if(miss>=3){gameOver();return;}
  ctx.shadowColor='#8a5a2b';ctx.shadowBlur=12;
  ctx.fillStyle='#c98a3d';ctx.fillRect(basket.x,basket.y,basket.w,basket.h);
  ctx.fillStyle='#8a5a2b';ctx.fillRect(basket.x+4,basket.y+4,basket.w-8,basket.h-8);
  ctx.shadowBlur=0;
  fruits.forEach(f=>{ctx.font='26px sans-serif';ctx.fillText(f.emoji,f.x,f.y);});
  raf=requestAnimationFrame(loop);
}
function gameOver(){
  over=true;cancelAnimationFrame(raf);sOver();
  document.getElementById('finalScore').textContent=score;
  document.getElementById('over').style.display='flex';
  parent.postMessage({type:'game-score',game:'catch',score:score},'*');
}
restart();
</script>
</body>
</html>
