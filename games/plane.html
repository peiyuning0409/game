<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>飞机大战</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden;padding:12px}
h2{margin:0 0 6px;font-size:22px;background:linear-gradient(90deg,#ffd700,#ff8c42);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
#info{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:10px;text-align:center}
#hud{display:flex;gap:24px;margin-bottom:10px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#hud .lbl{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:1px}
#hud .val{font-size:20px;color:#ffd700;font-weight:700;text-shadow:0 0 12px rgba(255,215,0,.4)}
#c{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);border-radius:12px;display:block;box-shadow:0 12px 40px rgba(0,0,0,.45);touch-action:none}
#over{display:none;position:fixed;inset:0;background:rgba(10,8,30,.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;flex-direction:column;z-index:20;animation:fadeIn .3s}
#over .score{font-size:44px;color:#ffd700;font-weight:800;text-shadow:0 0 20px rgba(255,215,0,.5)}
#over .sub{color:rgba(255,255,255,.6);margin-top:6px;font-size:14px}
button{margin-top:18px;padding:12px 34px;font-size:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffd700,#ff8c42);color:#1a1a2e;cursor:pointer;font-weight:700;box-shadow:0 6px 20px rgba(255,140,66,.35);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 26px rgba(255,140,66,.5)}
button:active{transform:scale(.96)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:640px){#c{max-width:min(94vw,400px);height:auto}}
</style>
</head>
<body>
<h2>飞机大战</h2>
<div id="info">鼠标 / 手指拖动控制飞机 · 自动开火 · 击落敌机</div>
<div id="hud">
  <div><div class="lbl">分数</div><div class="val" id="scoreBox">0</div></div>
  <div><div class="lbl">生命</div><div class="val" id="lifeBox">3</div></div>
</div>
<canvas id="c" width="400" height="600"></canvas>
<div id="over"><div class="score" id="finalScore">0</div><div class="sub">本局得分</div><button onclick="restart()">再来一局</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let plane,bullets,enemies,score,lives,over,raf,frame=0;
let actx=null;
function sfx(freq,dur,type,vol,slide){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=freq;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),actx.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sShoot=()=>sfx(600,.03,'square',.04,-100);
const sHit=()=>{sfx(400,.08,'triangle',.1,-100);setTimeout(()=>sfx(600,.08,'triangle',.08),30);};
const sHurt=()=>sfx(200,.2,'sawtooth',.12,-100);
const sOver=()=>{sfx(400,.2,'sawtooth',.12,-200);setTimeout(()=>sfx(200,.3,'sawtooth',.12,-120),150);};
function restart(){
  plane={x:180,y:500,w:40,h:50};
  bullets=[];enemies=[];score=0;lives=3;over=false;frame=0;
  document.getElementById('over').style.display='none';
  document.getElementById('scoreBox').textContent=0;
  document.getElementById('lifeBox').textContent=3;
  cancelAnimationFrame(raf);
  loop();
}
function setPlane(clientX,clientY){
  const rect=cv.getBoundingClientRect();
  const sx=400/rect.width,sy=600/rect.height;
  plane.x=(clientX-rect.left)*sx-plane.w/2;
  plane.y=(clientY-rect.top)*sy-plane.h/2;
  plane.x=Math.max(0,Math.min(400-plane.w,plane.x));
  plane.y=Math.max(0,Math.min(600-plane.h,plane.y));
}
cv.onmousemove=e=>{if(!over)setPlane(e.clientX,e.clientY);};
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!over)setPlane(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
function loop(){
  ctx.clearRect(0,0,400,600);
  frame++;
  if(frame%12===0){bullets.push({x:plane.x+plane.w/2-2,y:plane.y-10});sShoot();}
  if(frame%50===0){enemies.push({x:Math.random()*360,y:-40,w:30,h:30,speed:2+Math.random()*2});}
  bullets.forEach(b=>b.y-=8);
  enemies.forEach(e=>e.y+=e.speed);
  bullets.forEach(b=>{
    enemies.forEach(e=>{
      if(!e.dead&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){e.dead=true;b.dead=true;score+=10;sHit();document.getElementById('scoreBox').textContent=score;}
    });
  });
  bullets=bullets.filter(b=>!b.dead&&b.y>-10);
  enemies.forEach(e=>{
    if(!e.dead&&plane.x<e.x+e.w&&plane.x+plane.w>e.x&&plane.y<e.y+e.h&&plane.y+plane.h>e.y){
      e.dead=true;lives--;sHurt();
      document.getElementById('lifeBox').textContent=lives;
      if(lives<=0){sOver();gameOver();return;}
    }
  });
  enemies=enemies.filter(e=>!e.dead&&e.y<620);
  ctx.shadowColor='#4d96ff';ctx.shadowBlur=14;
  ctx.fillStyle='#4d96ff';ctx.fillRect(plane.x,plane.y,plane.w,plane.h);
  ctx.fillStyle='#ffd700';ctx.fillRect(plane.x+plane.w/2-3,plane.y-8,6,10);
  ctx.shadowBlur=0;
  bullets.forEach(b=>{ctx.fillStyle='#ffd700';ctx.fillRect(b.x,b.y,4,12);});
  enemies.forEach(e=>{ctx.fillStyle='#e74c3c';ctx.fillRect(e.x,e.y,e.w,e.h);});
  raf=requestAnimationFrame(loop);
}
function gameOver(){
  over=true;cancelAnimationFrame(raf);
  document.getElementById('finalScore').textContent=score;
  document.getElementById('over').style.display='flex';
  parent.postMessage({type:'game-score',game:'plane',score:score},'*');
}
restart();
</script>
</body>
</html>
